<header id="header" class="header">
  <div class="header__brand">
    <div class="wrapper">
      <h1 class="heading-brand">
        <a rel="author" href="{{ "/" | relative_url }}">
          {% include svg/brand.svg css-class="icon icon--brand" %}
        </a>
      </h1>
    </div>
  </div>

  <button
    id="header-hamburger"
    class="header__hamburger is-medium-hidden"
    aria-expanded="false"
    aria-label="Abrir menú de navegación"
    aria-controls="header-nav"
  >
    <span aria-hidden="true">&#9776;</span>
  </button>

  <nav
    id="header-nav"
    class="header__nav is-small-hidden"
  >
    <div class="wrapper">
      {% include nav-main.html %}
    </div>
  </nav>
</header>
